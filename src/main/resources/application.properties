# Nome da aplicacao
spring.application.name=marcasluxo

# Configuracao do Banco de Dados H2 em memoria
spring.datasource.url=jdbc:h2:mem:marcasluxodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar o console do banco H2 no navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostra os comandos SQL no terminal para a gente acompanhar o que o Hibernate faz
spring.jpa.show-sql=true

# Porta padrao do servidor web
server.port=8080
