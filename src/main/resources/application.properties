# Nome da aplicação Spring Boot
spring.application.name=cadastro-marca

# --- OPÇÃO 1: Banco de Dados PostgreSQL (Padrão solicitado pela professora) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/cadastro_marca
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- OPÇÃO 2: Banco H2 em memória (Caso o PostgreSQL não esteja rodando na máquina) ---
