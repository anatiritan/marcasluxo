# Nome da aplicação Spring Boot
spring.application.name=cadastro-marca

# Configuração da conexão com o banco de dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/cadastro_marca
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate JPA: dialeto do PostgreSQL e atualização automática das tabelas
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Exibe os comandos SQL no terminal/console para acompanhar as operações do Hibernate
spring.jpa.show-sql=true
